spring:
  application:
    name: backroom
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:backroom}}
    username: ${DATABASE_USERNAME:${POSTGRES_USER:backroom}}
    password: ${DATABASE_PASSWORD:${POSTGRES_PASSWORD}}
    hikari:
      maximum-pool-size: 4
      minimum-idle: 0
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true
  mvc:
    problemdetails:
      enabled: true
server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}
backroom:
  # Address printed into QR labels. Use a stable hostname before printing real labels.
  public-base-url: ${BACKROOM_PUBLIC_URL:http://localhost:${SERVER_PORT:8080}}
management:
  endpoints:
    web:
      exposure:
        include: health
    jmx:
      exposure:
        exclude: "*"
  endpoint:
    health:
      show-details: never
      show-components: never
