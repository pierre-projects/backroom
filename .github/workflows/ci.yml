name: Verify Phase 0

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm --prefix frontend ci
      - name: Type-check and compile frontend
        run: npm --prefix frontend run build
      - name: Verify backend against PostgreSQL
        run: ./mvnw -B -ntp clean verify
      - name: Configure local smoke-test environment
        run: cp .env.example .env
      - name: Build and smoke-test production container
        shell: pwsh
        run: ./scripts/smoke-test.ps1
      - name: Show container logs on failure
        if: failure()
        run: docker compose --profile app logs --tail 100
      - name: Stop containers
        if: always()
        run: docker compose --profile app down
